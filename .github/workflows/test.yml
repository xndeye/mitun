name: Test

on:
  push:
    branches: ['**']
    paths:
      - '**.sh'
      - 'files/**'
      - 'tools/**'
      - 'tests/**'
  pull_request:
    paths:
      - '**.sh'
      - 'files/**'
      - 'tools/**'
      - 'tests/**'

jobs:
  test:
    name: Syntax & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install shunit2
        run: sudo apt-get install -y shunit2

      # ----------------------------------------------------------------
      # Syntax check — all shell scripts
      # ----------------------------------------------------------------
      - name: Syntax check
        run: |
          FAILED=0
          for f in \
            common_functions.sh \
            customize.sh \
            service.sh \
            boot-completed.sh \
            uninstall.sh \
            tools/mitun_ctl.sh \
            build.sh \
            META-INF/com/google/android/update-binary \
            tests/test_common_functions.sh \
            tests/test_customize.sh \
            tests/test_boot_completed.sh \
            tests/test_validate_config.sh; do
            if sh -n "$f" 2>&1; then
              echo "OK  : $f"
            else
              echo "FAIL: $f"
              FAILED=1
            fi
          done
          [ "$FAILED" -eq 0 ]

      # ----------------------------------------------------------------
      # Unit tests — shunit2
      # ----------------------------------------------------------------
      - name: Run tests — common_functions
        run: sh tests/test_common_functions.sh

      - name: Run tests — customize
        run: sh tests/test_customize.sh

      - name: Run tests — boot-completed
        run: sh tests/test_boot_completed.sh

      - name: Run tests — validate_config
        run: sh tests/test_validate_config.sh
