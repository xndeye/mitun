name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Derive version
        id: version
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          CORE="${TAG#v}"; CORE="${CORE%%-*}"
          case "$CORE" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag '$TAG' is not semver"; exit 1 ;;
          esac
          MAJOR="${CORE%%.*}"
          REST="${CORE#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"
          VERSION_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          {
            echo "tag=${TAG}"
            echo "version_code=${VERSION_CODE}"
            echo "zip_name=mitun-${TAG}.zip"
          } >> "$GITHUB_OUTPUT"

      - name: Update module.prop
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          sed -i \
            -e "s/^version=.*/version=${TAG}/" \
            -e "s/^versionCode=.*/versionCode=${VERSION_CODE}/" \
            module.prop

      - name: Package
        id: package
        env:
          ZIP_NAME: ${{ steps.version.outputs.zip_name }}
        run: |
          set -eu
          zip -qrX "$ZIP_NAME" \
            module.prop \
            service.sh customize.sh boot-completed.sh action.sh uninstall.sh \
            common_functions.sh \
            skip_mount sepolicy.rule \
            files/config.yaml.example \
            files/config.json.example \
            webroot/index.html \
            META-INF/com/google/android/update-binary \
            META-INF/com/google/android/updater-script
          SHA256="$(sha256sum "$ZIP_NAME" | awk '{print $1}')"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: "MiTun ${{ github.ref_name }}"
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: ${{ steps.version.outputs.zip_name }}
          body: |
            ## 环境要求

            - KernelSU ≥ 0.7.0
            - Android ≥ 8.0（API 26）
            - mihomo ≥ 1.18.0，或 sing-box ≥ 0.9.0

            ## 安装

            1. 下载 `${{ steps.version.outputs.zip_name }}`，在 KernelSU 管理器安装
            2. 编辑 `.example` 示例配置后复制为实际配置
            3. 放置对应内核并 `chmod 0755`
            4. 重启设备

            ## 校验

            ```
            SHA-256: ${{ steps.package.outputs.sha256 }}
            ```
